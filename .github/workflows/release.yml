name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            formats: dmg
          # Oldest still-supported Ubuntu LTS, so the AppImage/deb only require an old glibc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: appimage,deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libvulkan-dev \
            squashfs-tools

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build and package
        run: cargo packager --release --formats ${{ matrix.formats }}

      # cargo-packager packs AppRun with mode 0744, so it cannot be executed by
      # users other than the owner. Repack the squashfs with world-readable/executable perms.
      - name: Fix AppImage permissions
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          for f in target/release/*.AppImage; do
            chmod +x "$f"
            offset=$("$f" --appimage-offset)
            work=$(mktemp -d)
            unsquashfs -q -n -d "$work/appdir" -o "$offset" "$f"
            chmod -R u+rwX,go+rX,go-w "$work/appdir"
            chmod 755 "$work/appdir/AppRun"
            head -c "$offset" "$f" > "$work/out.AppImage"
            mksquashfs "$work/appdir" "$work/fs.squashfs" \
              -comp zstd -root-owned -noappend -no-xattrs -quiet
            cat "$work/fs.squashfs" >> "$work/out.AppImage"
            mv "$work/out.AppImage" "$f"
            chmod +x "$f"
            rm -rf "$work"
            unsquashfs -o "$offset" -lls "$f" | grep ' squashfs-root/AppRun$'
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            target/release/*.dmg
            target/release/*-setup.exe
            target/release/*.AppImage
            target/release/*.deb
          if-no-files-found: error

  create-release:
    name: Create release
    # Manual runs only build the packages; releases are created from tags.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: artifacts
          merge-multiple: true

      - name: Extract changelog for this version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md \
            | sed '/^[[:space:]]*$/d' > release_notes.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.txt
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: Bump Homebrew Cask
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Release assets are named after the Cargo version, without the tag's "v" prefix.
      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew Cask
        uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: clutch
          formula-path: Casks/clutch.rb
          homebrew-tap: shitz/homebrew-clutch
          base-branch: main
          download-url: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Clutch_${{ steps.version.outputs.version }}_aarch64.dmg
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
